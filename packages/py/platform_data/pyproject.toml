[project]
name = "platform-data"
version = "0.1.0"
description = "Platform data layer: SQLAlchemy models, repositories, UoW"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["platform_data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
