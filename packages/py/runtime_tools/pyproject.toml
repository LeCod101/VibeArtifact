[project]
name = "runtime-tools"
version = "0.1.0"
description = "Runtime utilities: LLM adapters, locks, exporters, gates, cost"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "redis>=5.0",
    "langchain-core>=0.3",
    "langchain-deepseek>=0.1",
    "langchain-moonshot>=0.1",
    "langchain-openai>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["runtime_tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
