[project]
name = "ir-core"
version = "0.1.0"
description = "IR (Intermediate Representation) core data structures"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ir_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
