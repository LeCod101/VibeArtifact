[project]
name = "agents"
version = "0.1.0"
description = "Agent configs, prompts, translators, executors"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "ir-core",
]

[tool.uv.sources]
ir-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
