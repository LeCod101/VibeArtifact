[project]
name = "agents"
version = "0.2.0"
description = "Single Agent + Tools architecture for VibeArtifact"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "runtime-tools",
    "litellm>=1.0.0",
]

[tool.uv.sources]
runtime-tools = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
