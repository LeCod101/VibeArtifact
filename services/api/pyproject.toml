[project]
name = "vibeartifact-api"
version = "0.1.0"
description = "VibeArtifact platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "platform-data",
    "agents",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.0",
]

[tool.uv.sources]
platform-data = { workspace = true }
agents = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["vibeartifact_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
